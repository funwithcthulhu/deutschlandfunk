[package]
name = "deutschlandfunk_lingq_tool"
version = "1.0.0"
edition = "2024"
build = "build.rs"
description = "Unofficial desktop app for turning Deutschlandfunk articles and audio into LingQ lessons."
readme = "README.md"
repository = "https://github.com/funwithcthulhu/dlf-lingq-reader"
homepage = "https://github.com/funwithcthulhu/dlf-lingq-reader"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "clock"] }
dirs = "6.0"
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "process", "sync"] }
rusqlite = "0.39"
scraper = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.8"
urlencoding = "2.1"
webbrowser = "1.0"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
